[project]
name = "harbor-hypeman"
version = "0.1.0"
description = "Hypeman environment backend for Harbor Framework"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Kernel" }]
dependencies = [
  "dockerfile-parse>=2.0.1",
  "harbor>=0.21.0,<0.22",
  "hypeman>=0.1.0,<0.2",
  "pathspec>=1.0.3",
]

[project.urls]
Repository = "https://github.com/kernel/harbor-hypeman"
Changelog = "https://github.com/kernel/harbor-hypeman/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.15.0",
  "ty>=0.0.49",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python = ".venv"
